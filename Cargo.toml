[package]
name = "ctx"
version = "0.1.0"
edition = "2021"
description = "Codebase context tracker — like git for meaning"

[dependencies]
clap = { version = "4", features = ["derive"] }
notify = "7"
notify-debouncer-mini = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
daemonize = "0.5"
nix = { version = "0.29", features = ["signal", "process"] }
log = "0.4"
env_logger = "0.11"
regex = "1"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
